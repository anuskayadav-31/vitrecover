<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VITRecover{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/"><span class="brand-mark">♢</span><span><strong>VIT<span>Recover</span></strong><small>CAMPUS LOST &amp; FOUND</small></span></a>
  <nav>
    <a href="/">Browse</a>
    {% if user %}<a href="/report?kind=LOST">Report lost</a><a href="/report?kind=FOUND">Report found</a><a href="/dashboard" class="nav-cta">Dashboard</a><a href="/logout">Log out</a>
    {% else %}<a href="/login">Log in</a><a href="/register" class="nav-cta">Join VITRecover</a>{% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>VITRecover · VIT campus lost &amp; found · Private recovery by design</footer>
</body></html>
